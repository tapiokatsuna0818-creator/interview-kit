<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1a2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>面接シミュレーター</title>
<link rel="manifest" href='data:application/json,{"name":"面接シミュレーター","short_name":"面接SIM","start_url":".","display":"standalone","orientation":"portrait","background_color":"%231a2a4a","theme_color":"%231a2a4a","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 192 192%22%3E%3Crect width=%22192%22 height=%22192%22 rx=%2232%22 fill=%22%231a2a4a%22/%3E%3Ccircle cx=%2296%22 cy=%2272%22 r=%2234%22 fill=%22%23c9a24b%22/%3E%3Crect x=%2244%22 y=%22118%22 width=%22104%22 height=%2258%22 rx=%2229%22 fill=%22%23c9a24b%22/%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
<style>
/* ===== リセット & 変数 ===== */
:root{
  --navy:#1a2a4a; --navy-2:#243a63; --navy-3:#31507f;
  --ink:#1d2430; --paper:#ffffff; --mist:#f4f6fa; --line:#dde3ec;
  --accent:#c9a24b; --accent-d:#a9863a;
  --best:#2e7d5b; --ok:#c48a2a; --bad:#c0453f;
  --muted:#6a7686; --shadow:0 6px 22px rgba(20,32,58,.14);
  --radius:16px; --tap:44px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;
  color:var(--ink); background:var(--navy);
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
}
button{font-family:inherit; cursor:pointer;}
input,textarea{font-family:inherit;}

/* ===== レイアウト ===== */
#app{
  max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh;
  background:var(--mist); position:relative; overflow:hidden;
  display:flex; flex-direction:column;
  box-shadow:0 0 40px rgba(0,0,0,.25);
}
.screen{flex:1; display:flex; flex-direction:column; min-height:0; animation:fade .28s ease;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
.pad{padding:20px 18px calc(20px + env(safe-area-inset-bottom));}
.scroll{overflow-y:auto; -webkit-overflow-scrolling:touch;}
.grow{flex:1;}

/* ===== 共通テキスト ===== */
h1,h2,h3{margin:0 0 .4em; line-height:1.3;}
h1{font-size:23px;} h2{font-size:19px;} h3{font-size:16px;}
p{margin:0 0 .8em;}
.muted{color:var(--muted); font-size:14px;}
.tiny{font-size:12px;}
.center{text-align:center;}

/* ===== ボタン ===== */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  min-height:var(--tap); width:100%; padding:13px 16px; border:none;
  border-radius:12px; font-size:16px; font-weight:700;
  background:var(--navy); color:#fff; transition:transform .08s, background .15s;
}
.btn:active{transform:scale(.97);}
.btn.accent{background:var(--accent); color:#20160a;}
.btn.ghost{background:#fff; color:var(--navy); border:1.5px solid var(--line);}
.btn.sm{min-height:38px; padding:8px 14px; font-size:14px; width:auto;}
.btn:disabled{opacity:.45;}
.btn-row{display:flex; gap:10px; margin-top:12px;}

/* ===== カード ===== */
.card{
  background:#fff; border-radius:var(--radius); padding:18px;
  box-shadow:var(--shadow); margin-bottom:14px;
}
.card.tap{cursor:pointer; transition:transform .1s;}
.card.tap:active{transform:scale(.985);}

/* ===== ヘッダーバー ===== */
.topbar{
  display:flex; align-items:center; gap:10px; padding:12px 14px;
  padding-top:calc(12px + env(safe-area-inset-top));
  background:var(--navy); color:#fff; position:sticky; top:0; z-index:5;
}
.topbar .ico{
  width:38px; height:38px; border-radius:10px; border:none; background:rgba(255,255,255,.14);
  color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center;
}
.topbar .title{font-weight:700; font-size:16px; flex:1;}
.progress{height:4px; background:rgba(255,255,255,.2); border-radius:2px; overflow:hidden;}
.progress>i{display:block; height:100%; background:var(--accent); transition:width .3s;}

/* ===== タイトル画面 ===== */
.hero{
  background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 60%,var(--navy-3) 100%);
  color:#fff; padding:44px 22px 30px; text-align:center;
}
.hero .logo{
  width:76px; height:76px; margin:0 auto 16px; border-radius:20px;
  background:linear-gradient(145deg,var(--accent),var(--accent-d));
  display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(0,0,0,.3);
}
.hero .logo svg{width:44px; height:44px;}
.hero h1{color:#fff; font-size:26px;}
.hero .sub{color:rgba(255,255,255,.82); font-size:14px;}
.mode-card{
  text-align:left; display:flex; align-items:center; gap:14px;
}
.mode-card .badge{
  min-width:52px; height:52px; border-radius:14px; display:flex;
  align-items:center; justify-content:center; font-size:26px; color:#fff;
  background:linear-gradient(145deg,var(--navy-2),var(--navy-3));
}
.mode-card.free .badge{background:linear-gradient(145deg,var(--best),#256e4d);}
.mode-card h3{margin-bottom:2px;}
.locked{opacity:.5; position:relative;}
.lock-label{
  font-size:11px; background:var(--accent); color:#20160a; padding:2px 8px;
  border-radius:20px; font-weight:700; margin-left:6px;
}

/* ===== ノベルシーン ===== */
.scene-wrap{flex:1; display:flex; flex-direction:column; min-height:0;}
.scene-img{
  flex:2; min-height:0; position:relative; overflow:hidden;
  display:flex; align-items:flex-end; justify-content:center;
}
.scene-txt{
  flex:1; min-height:34%; background:rgba(255,255,255,.97); border-top:3px solid var(--accent);
  padding:16px 18px calc(18px + env(safe-area-inset-bottom)); position:relative;
  display:flex; flex-direction:column;
}
.nameplate{
  position:absolute; top:-15px; left:16px; background:var(--navy); color:#fff;
  padding:4px 14px; border-radius:20px; font-size:13px; font-weight:700; box-shadow:var(--shadow);
}
.scene-txt .body{flex:1; overflow-y:auto; font-size:16px; padding-top:6px;}
.tap-hint{text-align:right; color:var(--accent-d); font-size:12px; animation:blink 1.2s infinite;}
@keyframes blink{50%{opacity:.35;}}

/* プレースホルダー画像（グラデ＋シルエット） */
.ph-bg{position:absolute; inset:0;}
.ph-silhouette{
  position:relative; width:150px; height:190px; margin-bottom:0; opacity:.9;
}
.ph-tag{
  position:absolute; top:10px; left:10px; background:rgba(0,0,0,.35); color:#fff;
  font-size:10px; padding:3px 7px; border-radius:6px; letter-spacing:.03em;
}

/* ===== 5択 ===== */
.q-stem{background:#fff; border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:14px;}
.q-topic{font-size:11px; color:var(--accent-d); font-weight:700; letter-spacing:.05em; margin-bottom:4px;}
.choice{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:#fff; border:1.5px solid var(--line); border-radius:12px;
  padding:13px 14px; margin-bottom:10px; min-height:var(--tap); font-size:15px; color:var(--ink);
  transition:border-color .15s, background .15s;
}
.choice .k{
  min-width:26px; height:26px; border-radius:50%; background:var(--mist);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--navy);
}
.choice:active{background:var(--mist);}
.choice.sel-best{border-color:var(--best); background:#eaf6f0;}
.choice.sel-ok{border-color:var(--ok); background:#fbf3e2;}
.choice.sel-bad{border-color:var(--bad); background:#fbecea;}
.choice.dim{opacity:.5;}

/* ===== モーダル ===== */
.modal-bg{
  position:fixed; inset:0; background:rgba(15,22,40,.55); z-index:50;
  display:flex; align-items:flex-end; justify-content:center; animation:fade .2s;
}
.modal{
  background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom)); max-height:82vh; overflow-y:auto;
  animation:slideup .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideup{from{transform:translateY(100%);} to{transform:none;}}
.verdict-pill{
  display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:20px;
  font-size:13px; font-weight:700; color:#fff; margin-bottom:10px;
}
.vp-best{background:var(--best);} .vp-ok{background:var(--ok);} .vp-bad{background:var(--bad);}
.layer{border-left:3px solid var(--line); padding:2px 0 2px 12px; margin:0 0 12px;}
.layer .lab{font-size:12px; font-weight:700; color:var(--accent-d); margin-bottom:2px;}
.layer.consensus{border-color:var(--best);}
.layer.schools{border-color:var(--accent);}
.layer.practice{border-color:var(--navy-3);}
.src-note{font-size:12px; color:var(--muted); margin-top:6px;}

/* ===== 診断カード / 結果 ===== */
.score-hero{
  background:linear-gradient(160deg,var(--navy),var(--navy-3)); color:#fff;
  border-radius:var(--radius); padding:22px; text-align:center; margin-bottom:16px; box-shadow:var(--shadow);
}
.score-num{font-size:52px; font-weight:800; line-height:1;}
.rank-badge{
  display:inline-block; font-size:34px; font-weight:800; width:64px; height:64px; line-height:64px;
  border-radius:50%; background:var(--accent); color:#20160a; margin-bottom:8px;
}
.bar-row{margin-bottom:12px;}
.bar-row .bl{display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;}
.bar{height:12px; background:var(--line); border-radius:6px; overflow:hidden;}
.bar>i{display:block; height:100%; background:linear-gradient(90deg,var(--navy-3),var(--accent)); border-radius:6px; transition:width .5s;}
.weak-chip{
  display:inline-block; background:#fbecea; color:var(--bad); border:1px solid #f0c9c6;
  padding:6px 12px; border-radius:20px; font-size:13px; font-weight:700; margin:0 6px 6px 0;
}
.axis-grid{display:flex; gap:10px; margin-bottom:14px;}
.axis-box{flex:1; background:#fff; border-radius:12px; padding:12px 8px; text-align:center; box-shadow:var(--shadow);}
.axis-box .n{font-size:26px; font-weight:800; color:var(--navy);}
.axis-box .l{font-size:11px; color:var(--muted);}

/* ===== テキスト入力 ===== */
.ta-wrap{flex:1; display:flex; flex-direction:column; padding:16px 16px calc(16px + env(safe-area-inset-bottom));}
textarea.answer{
  flex:1; min-height:150px; width:100%; border:1.5px solid var(--line); border-radius:12px;
  padding:14px; font-size:15px; line-height:1.7; resize:none; background:#fff;
}
textarea.answer:focus{outline:none; border-color:var(--accent);}
.counter{text-align:right; font-size:12px; color:var(--muted); margin:6px 2px;}
.counter.warn{color:var(--bad);}

/* ===== 履歴・知識 ===== */
.list-item{background:#fff; border-radius:12px; padding:14px; box-shadow:var(--shadow); margin-bottom:10px;}
.list-item .meta{font-size:12px; color:var(--muted);}
.pills{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
.pill{font-size:11px; background:var(--mist); border-radius:20px; padding:3px 10px; color:var(--navy);}
.copybox{background:var(--navy); color:#cfe; border-radius:12px; padding:12px; font-size:12px; max-height:120px; overflow:auto; white-space:pre-wrap; margin-bottom:10px;}

/* ===== トースト ===== */
.toast{
  position:fixed; bottom:calc(24px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:10px 18px; border-radius:24px; font-size:14px; z-index:80;
  box-shadow:var(--shadow); animation:fade .2s;
}
.divider{height:1px; background:var(--line); margin:16px 0;}
.notice{background:#fff5e0; border:1px solid #f0dca8; border-radius:10px; padding:10px 12px; font-size:13px; color:#7a5c1a; margin-bottom:12px;}
svg.line-graph{width:100%; height:auto; background:#fff; border-radius:12px; box-shadow:var(--shadow);}
/* 診断結果 強化（A-1） */
.cat-comment{font-size:12px; margin:4px 2px 0; line-height:1.55;}
.cat-comment.good{color:var(--best);}
.cat-comment.bad{color:var(--bad);}
.weak-block{margin-bottom:12px;}
.weak-advice{background:#fff; border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:8px; padding:9px 11px; font-size:13px; line-height:1.6; margin-top:6px;}
.weak-advice b{color:var(--accent-d);}
.cta-box{background:linear-gradient(160deg,var(--navy),var(--navy-3)); color:#fff; border-radius:var(--radius); padding:16px; margin:16px 0; box-shadow:var(--shadow);}
.cta-lead{font-size:13px; line-height:1.75; opacity:.93; margin-bottom:12px;}
.cta-btn{text-decoration:none;}
.rv-item{background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden;}
.rv-item>summary{list-style:none; cursor:pointer; padding:11px 13px; display:flex; align-items:center; gap:8px; font-size:13px; min-height:var(--tap);}
.rv-item>summary::-webkit-details-marker{display:none;}
.rv-ok{color:var(--best); font-weight:800;}
.rv-ng{color:var(--bad); font-weight:800;}
.rv-topic{color:var(--accent-d); font-weight:700; white-space:nowrap;}
.rv-prompt{color:var(--ink); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rv-body{padding:2px 13px 12px; border-top:1px solid var(--line);}
.rv-line{margin:8px 0;}
.rv-line .verdict-pill{white-space:normal; display:inline-block; line-height:1.5;}
/* 初回インストールガイド（A-2） */
.install-sheet h3{margin-bottom:8px;}
.install-sheet .ig-hint{background:var(--mist); border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.6; margin-bottom:14px;}
/* ===== 05: 減点方式＋UX全面改修 ===== */
/* C-2 設問レイアウト */
.q-stem .q-prompt{font-size:17px; line-height:1.7;}
.q-stem .q-topic{margin-bottom:6px;}
.choice{position:relative; align-items:flex-start; padding:15px 16px; margin-bottom:12px; line-height:1.6;}
.choice .k{margin-top:1px;}
.choice.flash{animation:chFlash .4s ease;}
@keyframes chFlash{0%{transform:scale(1);}30%{transform:scale(1.02);}100%{transform:scale(1);}}
/* A-3 ポイントチップ */
.pt-chip{position:absolute; right:12px; top:50%; font-weight:800; font-size:15px; padding:3px 11px; border-radius:20px; opacity:0; transform:translateY(-50%) scale(.6); animation:ptPop .5s cubic-bezier(.2,1.4,.4,1) forwards; pointer-events:none; box-shadow:0 3px 10px rgba(20,32,58,.2);}
.pt-plus{background:var(--best); color:#fff;}
.pt-mid{background:var(--accent); color:#20160a;}
.pt-minus{background:var(--bad); color:#fff;}
@keyframes ptPop{0%{opacity:0; transform:translateY(-50%) scale(.6);}45%{opacity:1; transform:translateY(-50%) scale(1.18);}100%{opacity:1; transform:translateY(-50%) scale(1);}}
/* C-3 解説モーダル構造化 */
.modal.modal-ux{max-height:86vh; padding-bottom:0;}
.modal .ex-correct{background:#eaf6f0; border:1px solid #bfe3d0; border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.6; margin:4px 0 12px;}
.modal .ex-correct b{color:var(--best);}
.ex-block{border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden;}
.ex-block.consensus{border-left:3px solid var(--best);}
.ex-block.schools{border-left:3px solid var(--accent);}
.ex-block.practice{border-left:3px solid var(--navy-3);}
.ex-block .ex-fixed-head, .ex-block>summary{padding:9px 12px; font-weight:700; font-size:13px;}
.ex-block>summary{cursor:pointer; list-style:none; color:var(--accent-d);}
.ex-block>summary::-webkit-details-marker{display:none;}
.ex-block>summary::after{content:" ＋"; color:var(--muted);}
.ex-block[open]>summary::after{content:" −";}
.ex-block .ex-body{padding:0 12px 11px; font-size:14px; line-height:1.75;}
.modal .next-fixed{position:sticky; bottom:0; margin:10px -18px 0; padding:12px 18px calc(12px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--line);}
/* C-4 結果画面 */
.count-score{font-size:54px; font-weight:800; line-height:1;}
.count-score span{font-size:20px; margin-left:2px;}
.rank-stamp{margin:10px 0 2px;}
.rank-stamp .rk{display:inline-block; font-size:38px; font-weight:800; width:74px; height:74px; line-height:74px; border-radius:50%; background:var(--accent); color:#20160a; transform:scale(0); animation:rkStamp .5s cubic-bezier(.2,1.5,.4,1) .35s forwards;}
@keyframes rkStamp{0%{transform:scale(0) rotate(-12deg); opacity:0;}70%{transform:scale(1.12) rotate(3deg); opacity:1;}100%{transform:scale(1) rotate(0); opacity:1;}}
.rank-title{font-size:22px; font-weight:800; color:#fff; margin-top:10px; opacity:0; animation:rtUp .5s ease .75s forwards;}
@keyframes rtUp{from{opacity:0; transform:translateY(8px);}to{opacity:1; transform:none;}}
.result-card{background:#fff; border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin-bottom:16px;}
.sec-h{font-size:15px; font-weight:700; margin:0 0 10px;}
.weak-card{background:#fbecea; border:1px solid #f0c9c6; border-left:4px solid var(--bad); border-radius:12px; padding:14px; margin-bottom:12px;}
.weak-card .wc-label{font-size:12px; font-weight:800; color:var(--bad); letter-spacing:.05em;}
.weak-card .wc-topic{font-size:16px; font-weight:700; margin:2px 0 8px;}
.weak-card .wc-todo{background:#fff; border-radius:8px; padding:9px 11px; font-size:13px; line-height:1.6;}
.weak-card .wc-todo b{color:var(--accent-d);}
.rv-pts{margin-left:auto; font-weight:800; font-size:12px; padding-left:8px;}
.rv-pts.p-plus{color:var(--best);} .rv-pts.p-mid{color:var(--accent-d);} .rv-pts.p-minus{color:var(--bad);}
</style>
</head>
<body>
<div id="app"><div class="screen pad"><p class="muted">読み込み中…</p></div></div>

<script>
"use strict";
/* ============================================================
   面接シミュレーター エンジン v1.0
   - 単一HTML / 外部通信ゼロ / Vanilla JS / 決定論採点
   - trial(診断キット) と full(シミュレーター) を共通エンジンで駆動
   ============================================================ */

/* ---------- CONFIG（統合時はここを固定して1形態に分岐） ---------- */
var CONFIG = { edition: "trial", locale: "ja" };   // edition は起動時に選択（trial|full）

/* ============================================================
   GAME_DATA（プレースホルダー：スキーマ準拠のダミー）
   統合時は残プレースホルダーを全差し替え
   ============================================================ */
var GAME_DATA = {
  meta: { version: "3.0", locale: "ja", edition: "trial" },

  personas: [
    {
      id: "p4",
      name: "優しいが鋭い",
      intro: "終始おだやかな物腰の面接官。相づちも柔らかい。ただし、回答の曖昧な部分は決して聞き流さず、静かに核心へ踏み込んでくる。",
      expressions: { neutral: "face_p4_neutral", stern: "face_p4_thinking", smile: "face_p4_smile", thinking: "face_p4_thinking" },
      lines: {
        greeting: ["本日はお越しいただきありがとうございます。どうぞ、楽になさってください。普段のお仕事の話を聞かせていただければ十分です。"],
        probe_short: ["すみません、もう少しだけ伺ってもいいですか。今のお話、私の理解がまだ追いついていない気がして。"],
        probe_noExample: ["素敵な考え方ですね。ちなみに、それが実際の場面で形になったこと、何か一つ思い浮かびますか。"],
        ack: ["なるほど、そういうことでしたか。"],
        closing: ["ありがとうございました。最後にひとつだけ——今度はあなたの番です。何か、私に聞いておきたいことはありますか。"]
      }
    }
  ],

  scenes: [
    { id:"reception", type:"story", bg:"bg_reception", text:"面接開始10分前。オフィスビルの受付に着いた。案内板の内線番号を確認し、受話器に手を伸ばす。——ここから、もう面接は始まっている。", next:"hallway" },
    { id:"hallway",   type:"story", bg:"bg_hallway",   text:"担当者に案内され、静かな廊下を進む。面接室のドアの前で足が止まる。深呼吸をひとつ。", next:"door" },
    { id:"door",      type:"choice", bg:"bg_door",     mannerRef:null, scene:"door", next:"enter" },

   ============================================================ */
var Store = (function(){
  var PREFIX="ivs_", mem={}, ok=false;
  try{ var k="ivs_test"; localStorage.setItem(k,"1"); localStorage.removeItem(k); ok=true; }catch(e){ ok=false; }
  function get(key,def){
    try{
      var raw = ok ? localStorage.getItem(PREFIX+key) : (mem[key]!==undefined?mem[key]:null);
      return raw==null ? def : JSON.parse(raw);
    }catch(e){ return def; }
  }
  function set(key,val){
    var raw=JSON.stringify(val);
    try{ if(ok) localStorage.setItem(PREFIX+key,raw); else mem[key]=raw; }
    catch(e){ mem[key]=raw; }
  }
  function del(key){ try{ if(ok) localStorage.removeItem(PREFIX+key); else delete mem[key]; }catch(e){} }
  return { get:get, set:set, del:del, available:ok };
})();

/* ============================================================
   テキスト解析（簡易形態素：2文字以上のカタカナ/漢字連続を語に）
   ============================================================ */
function extractNouns(text){
  if(!text) return [];
  var re=/[ァ-ヶー]{2,}|[一-龥々〆ヵヶ]{2,}/g, m, out=[];
  while((m=re.exec(text))!==null){ out.push(m[0]); }
  return out;
}
function jaccard(aText,bText){
  var A=new Set(extractNouns(aText)), B=new Set(extractNouns(bText));
  if(A.size===0||B.size===0) return 0;
  var inter=0; A.forEach(function(x){ if(B.has(x)) inter++; });
  var uni=A.size+B.size-inter;
  return uni===0?0:Math.round(inter/uni*100);
}
function stdev(arr){
  if(arr.length<2) return 0;
  var mean=arr.reduce(function(a,b){return a+b;},0)/arr.length;
  var v=arr.reduce(function(a,b){return a+(b-mean)*(b-mean);},0)/arr.length;
  return Math.sqrt(v);
}

/* ============================================================
   周回選抜（決定論）：serial % pool長 を開始位置に巡回
   ============================================================ */
function cyclicSelect(pool, count, serial){
  if(pool.length===0) return [];
  var n=Math.min(count,pool.length), start=((serial%pool.length)+pool.length)%pool.length, out=[];
  for(var i=0;i<n;i++){ out.push(pool[(start+i)%pool.length]); }
  return out;
}

/* ============================================================
   採点ロジック（決定論・AI/乱数なし）
   ============================================================ */
/* trial: 5択 points 合計→100換算＋rank＋topic内訳＋弱点 */
function scoreQuiz(answers){
  var got=0, max=0, byTopic={};
  answers.forEach(function(a){
    got+=a.points; max+=2;
    if(!byTopic[a.topic]) byTopic[a.topic]={got:0,max:0};
    byTopic[a.topic].got+=a.points; byTopic[a.topic].max+=2;
  });
  // 減点方式（A-1/A-2）: 素点合計・topic素点は max(0, …) で下限クランプ（負の点/バーを出さない）
  var score=max>0?Math.round(Math.max(0,got)/max*100):0;
  var rank=GAME_DATA.quizDeck.rankTable.find(function(r){return score>=r.min&&score<=r.max;})||GAME_DATA.quizDeck.rankTable[0];
  var topics=Object.keys(byTopic).map(function(t){
    return { topic:t, rate:byTopic[t].max>0?Math.round(Math.max(0,byTopic[t].got)/byTopic[t].max*100):0 };
  });
  var weak=topics.slice().sort(function(x,y){return x.rate-y.rate;}).slice(0,2);
  return { score:score, rank:rank, topics:topics, weak:weak };
}

/* full: 3軸100点＋改善点3つ
   qaAnswers: [{category, text, isProbe}] （本回答＋深掘り）
   mannerAnswers: [{points}]                （シーン内＋逆質問5択）
*/
function scoreFull(qaAnswers, mannerAnswers){
  /* 1. マナー軸 */
  var mGot=0,mMax=0;
  mannerAnswers.forEach(function(a){ mGot+=a.points; mMax+=2; });
  var mannerScore=mMax>0?Math.round(mGot/mMax*100):0;

  /* 2. 回答形式軸 */
  var perAns=[], lenFlags={short:0,long:0}, concFail=0, exFail=0;
  qaAnswers.forEach(function(a){
    var len=a.text.replace(/\s/g,"").length;
    // (a) 文字数レンジ
    var lenScore;
    if(len>=80&&len<=400) lenScore=100;
    else if(len<80){ lenScore=Math.round(len/80*100); lenFlags.short++; }
    else { lenScore=Math.max(0,Math.round(100-(len-400)*100/400)); lenFlags.long++; }
    // (b) 結論先行：冒頭80字内に conclusion キーワード
    var head=a.text.slice(0,80);
    var conc=(a.keywords.conclusion||[]).some(function(k){return head.indexOf(k)>=0;});
    if(!conc) concFail++;
    // (c) 具体例：example キーワード1つ以上
    var ex=(a.keywords.example||[]).some(function(k){return a.text.indexOf(k)>=0;});
    if(!ex) exFail++;
    perAns.push(Math.round((lenScore+(conc?100:0)+(ex?100:0))/3));
  });
  var formScore=perAns.length?Math.round(perAns.reduce(function(x,y){return x+y;},0)/perAns.length):0;

  /* 3. 一貫性軸 */
  function catText(cat){
    return qaAnswers.filter(function(a){return a.category===cat&&!a.isProbe;}).map(function(a){return a.text;}).join(" ");
  }
  var resig=catText("resignation"), moti=catText("motivation"), pr=catText("selfPR");
  var main=jaccard(resig,moti);            // 主判定
  var sub=jaccard(pr,moti);                // 副判定
  var lens=qaAnswers.filter(function(a){return !a.isProbe;}).map(function(a){return a.text.replace(/\s/g,"").length;});
  var meanLen=lens.length?lens.reduce(function(x,y){return x+y;},0)/lens.length:0;
  var cv=meanLen>0?stdev(lens)/meanLen:0;
  var balanceScore=Math.max(0,Math.round(100-cv*100));   // ばらつき小さいほど高
  var consistScore=Math.round(main*0.5 + sub*0.3 + balanceScore*0.2);

  /* 改善点3つ（各軸の最大失点要因→テンプレ選択） */
  var T=GAME_DATA.improvementTemplates, imp=[];
  imp.push(mannerScore<70 ? T.manner : (formScore<70?T.example:T.solid));
  // 形式軸の要因
  if(concFail>=exFail && concFail>0) imp.push(T.conclusion);
  else if(exFail>0) imp.push(T.example);
  else if(lenFlags.short>lenFlags.long && lenFlags.short>0) imp.push(T.length_short);
  else if(lenFlags.long>0) imp.push(T.length_long);
  else imp.push(T.solid);
  // 一貫性軸の要因
  if(main<50) imp.push(T.consistency);
  else if(balanceScore<70) imp.push(T.balance);
  else imp.push(T.solid);
  // 重複整理＋3つ確保
  imp=dedupeKeep3(imp, T);

  return {
    manner:mannerScore, form:formScore, consist:consistScore,
    detail:{ main:main, sub:sub, balance:balanceScore, concFail:concFail, exFail:exFail, lenFlags:lenFlags },
    improvements:imp
  };
}
function dedupeKeep3(arr, T){
  var seen={}, out=[];
  arr.forEach(function(x){ if(!seen[x]){ seen[x]=1; out.push(x); } });
  var pool=[T.solid,T.conclusion,T.example,T.consistency,T.balance,T.length_short];
  var pi=0;
  while(out.length<3 && pi<pool.length){ if(!seen[pool[pi]]){ seen[pool[pi]]=1; out.push(pool[pi]); } pi++; }
  return out.slice(0,3);
}

function buildReviewLog(sess){
  var t=GAME_DATA.aiReviewTemplate, L=[];
  L.push(t.header); L.push("");
  // A-2: 添削AIに面接文脈を渡す（sel優先・履歴のトップレベル値をフォールバック）
  var cond=sess.sel||{ jobType:sess.jobType, stage:sess.stage };

  L.push("ジョブタイプ: "+(cond.jobType||"-")+" / 選考段階: "+(cond.stage||"-")+" / 面接官: "+(sess.persona||"-"));
  L.push("");
  L.push("■ 面接ログ");
  sess.transcript.forEach(function(x){ L.push("Q: "+x.q); L.push("A: "+x.a); });
  L.push(""); L.push("■ 自動採点");
  L.push("マナー軸: "+sess.scores.manner+" / 回答形式軸: "+sess.scores.form+" / 一貫性軸: "+sess.scores.consist);
  L.push("改善点: "+sess.scores.improvements.join(" / "));
  L.push(""); L.push(t.footer);
  return L.join("\n");
}
function copyText(text, okMsg){
  function fallback(){
    try{
      var ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.top="-1000px";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta); toast(okMsg||"コピーしました");
    }catch(e){ toast("コピーに失敗。手動で選択してください"); }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast(okMsg||"コピーしました");}, fallback);
  } else fallback();
}

/* 獲得ポイントの符号付き表記（減点方式・A-3/A-4/C） */
function pointLabel(p){ return p>0?("+"+p):(p<0?("−"+Math.abs(p)):"±0"); }
function pointCls(p){ return p>0?"p-plus":(p<0?"p-minus":"p-mid"); }
/* スコアのカウントアップ（決定論・乱数なし。rAF非対応環境は即確定） */
function animateCount(el, to, ms){
  if(!(window.requestAnimationFrame)){ el.firstChild.nodeValue=String(to); return; }
  var start=null;
  function step(ts){
    if(start===null) start=ts;
    var p=Math.min(1,(ts-start)/ms), eased=1-Math.pow(1-p,3);
    el.firstChild.nodeValue=String(Math.round(to*eased));
    if(p<1) window.requestAnimationFrame(step);
  }
  window.requestAnimationFrame(step);
}

/* ---------- 面接開始 / 進行 ---------- */
/* A-1: 指定カテゴリが qList に無ければ、プールから serial%該当数 番目を preferIdx に入れる。
   preferIdx が resignation スロットを潰す場合は左へずらす（衝突回避）。乱数不使用＝決定論。 */
function ensureCategory(qList, pool, cat, preferIdx, serial){
  if(qList.some(function(q){ return q.category===cat; })) return;   // 既に含まれる
  var cands=pool.filter(function(q){ return q.category===cat; });
  if(cands.length===0) return;                                      // プールに無ければ何もしない（データ側責任）
  var pick=cands[((serial % cands.length)+cands.length)%cands.length];
  var idx=preferIdx;
  while(idx>0 && qList[idx] && qList[idx].category==="resignation") idx--;  // resignationと衝突させない
  if(idx<0) idx=0;
  qList[idx]=pick;
}
function beginInterview(){
  var serial=nextSerial();
  var persona=GAME_DATA.personas.find(function(p){return p.id===S.sel.personaId;})||GAME_DATA.personas[0];
  // 質疑プール：jobType(common+選択) × stage(any+選択) で絞り、周回選抜5〜8問
  var pool=GAME_DATA.qaBank.filter(function(q){
    var jt=(q.jobType==="common"||q.jobType===S.sel.jobType);
    var st=(q.stage==="any"||q.stage===S.sel.stage);
    return jt&&st;
  });
  var qList=cyclicSelect(pool, Math.min(8,Math.max(5,pool.length)), serial);
  // A-1: 一貫性軸の主判定が崩れないよう resignation / motivation を強制包含（決定論・乱数なし）
  ensureCategory(qList, pool, "resignation", qList.length-1, serial);  // 末尾
  ensureCategory(qList, pool, "motivation",  qList.length-2, serial);  // 末尾から2番目（resignationと衝突回避）
  S.iv={
    serial:serial, persona:persona, sel:S.sel,
    sceneIdx:0, qaIdx:0, qList:qList,
    qaAnswers:[], mannerAnswers:[], transcript:[],
    pendingProbe:null
  };
  saveResume();
  runScene();
}
function saveResume(){
  // 中断復帰用に逐次保存（回答全文含む）
  Store.set("resume", {
    serial:S.iv.serial, sel:S.iv.sel, sceneIdx:S.iv.sceneIdx, qaIdx:S.iv.qaIdx,
    qIds:S.iv.qList.map(function(q){return q.id;}),
    qaAnswers:S.iv.qaAnswers, mannerAnswers:S.iv.mannerAnswers, transcript:S.iv.transcript
  });
}
function resumeInterview(r){
  var persona=GAME_DATA.personas.find(function(p){return p.id===r.sel.personaId;})||GAME_DATA.personas[0];
  var qList=r.qIds.map(function(id){return GAME_DATA.qaBank.find(function(q){return q.id===id;});}).filter(Boolean);
  S.sel=r.sel;
  S.iv={ serial:r.serial, persona:persona, sel:r.sel, sceneIdx:r.sceneIdx, qaIdx:r.qaIdx,
    qList:qList, qaAnswers:r.qaAnswers||[], mannerAnswers:r.mannerAnswers||[], transcript:r.transcript||[], pendingProbe:null };
  runScene();
}
function abortInterview(){
  var m=document.createElement("div"); m.className="modal-bg";
  m.innerHTML='<div class="modal"><h3>面接を中断しますか？</h3><p class="muted">ここまでの進行は保存され、後で「続きから」再開できます。</p>'+
    '<div class="btn-row"><button class="btn" id="stay">続ける</button><button class="btn ghost" id="quit">中断する</button></div></div>';
  document.body.appendChild(m);
  document.getElementById("stay").onclick=function(){ m.remove(); };
  document.getElementById("quit").onclick=function(){ m.remove(); saveResume(); screenFullHome(); };
}
function runScene(){
  var sc=GAME_DATA.scenes[S.iv.sceneIdx];
  S.iv.sceneIdx=S.iv.sceneIdx; saveResume();
  if(sc.type==="story") return renderStory(sc);
  if(sc.type==="choice") return renderSceneChoice(sc);
  if(sc.type==="qa") return renderQA();
  if(sc.type==="reverse_q") return renderReverseQ();
  if(sc.type==="result") return renderFullResult();
}
function advanceScene(){
  var sc=GAME_DATA.scenes[S.iv.sceneIdx];
  var nextIdx=GAME_DATA.scenes.findIndex(function(s){return s.id===sc.next;});
  S.iv.sceneIdx = nextIdx>=0?nextIdx:S.iv.sceneIdx+1;
  runScene();

function renderQA(){
  if(S.iv.qaIdx>=S.iv.qList.length){ advanceScene(); return; }
  var q=S.iv.qList[S.iv.qaIdx], sc=GAME_DATA.scenes[S.iv.sceneIdx], persona=S.iv.persona;
  var qtext = S.iv.pendingProbe ? S.iv.pendingProbe.question : q.question;
  var greet = (S.iv.qaIdx===0 && !S.iv.pendingProbe && persona.lines.greeting[0]) ? persona.lines.greeting[0]+"<br><br>" : "";
  h(
    '<div class="screen scene-wrap">'+
      topbar("質疑 "+(S.iv.qaIdx+1)+" / "+S.iv.qList.length, abortInterview)+
      '<div class="scene-img" style="flex:1.1">'+sceneImgHTML(sc.bg)+'</div>'+
      '<div class="scene-txt" style="flex:0 0 auto"><div class="nameplate">'+esc(persona.name)+'</div>'+
        '<div class="body">'+greet+esc(qtext)+'</div></div>'+
      '<div class="ta-wrap" style="flex:1">'+
        '<textarea class="answer" id="ans" placeholder="ここに回答を入力（送信後は取り消せません）"></textarea>'+
        '<div class="counter" id="cnt">0 字</div>'+
        '<button class="btn accent" id="send">回答する</button>'+
      '</div>'+
    '</div>'
  );
  bindBack(abortInterview);
  var ta=document.getElementById("ans"), cnt=document.getElementById("cnt");
  ta.oninput=function(){
    var l=ta.value.replace(/\s/g,"").length; cnt.textContent=l+" 字";
    cnt.className="counter"+((l>0&&l<80)||l>400?" warn":"");
  };
  document.getElementById("send").onclick=function(){
    var text=ta.value.trim();
    if(text.length===0){ toast("回答を入力してください"); return; }
    submitAnswer(q, text);
  };
}
function submitAnswer(q, text){
  var isProbe=!!S.iv.pendingProbe;
  S.iv.qaAnswers.push({ category:q.category, text:text, isProbe:isProbe, keywords:q.evalKeywords });
  S.iv.transcript.push({ q:(isProbe?S.iv.pendingProbe.question:q.question), a:text });
  if(isProbe){
    S.iv.pendingProbe=null; S.iv.qaIdx++; saveResume(); renderQA(); return;
  }
  // 深掘りトリガー判定（1問のみ）
  var len=text.replace(/\s/g,"").length;
  var hasEx=(q.evalKeywords.example||[]).some(function(k){return text.indexOf(k)>=0;});
  var probe=null, ps=q.probes||[];
  probe = ps.find(function(p){return p.trigger==="short"&&len<80;})
       || ps.find(function(p){return p.trigger==="no_example"&&!hasEx;})
       || ps.find(function(p){return p.trigger==="always";}) || null;
  if(probe){ S.iv.pendingProbe=probe; saveResume(); renderQA(); }
  else { S.iv.qaIdx++; saveResume(); renderQA(); }
}
/* 逆質問（①5択 ②フリー入力1問） */
function renderReverseQ(){
  var sc=GAME_DATA.scenes[S.iv.sceneIdx], persona=S.iv.persona;
  var pool=GAME_DATA.mannerQuestions.filter(function(m){ return m.scene==="reverse_q"; });
  var picked=cyclicSelect(pool,1,S.iv.serial)[0];
  if(!picked){ S.iv._rqDone=true; }
  if(!S.iv._rqDone && picked){
    h(sceneShell(sc, persona.name,
      '<div>'+esc(persona.lines.closing[0]||"最後に質問はありますか。")+'</div>'+
      '<div class="q-topic" style="margin-top:10px">'+esc(picked.topic)+'</div><div style="font-weight:700;margin-bottom:10px">'+esc(picked.prompt)+'</div><div id="choices"></div>', false));
    bindBack(abortInterview);
    renderChoices(picked, function(ci){
      var c=picked.choices[ci];
      S.iv.mannerAnswers.push({ id:picked.id, points:c.points, verdict:c.verdict });
      S.iv.transcript.push({ q:"[逆質問5択] "+picked.prompt, a:"選択"+["A","B","C","D","E"][ci]+"（"+c.verdict+"）" });
      S.iv._rqDone=true; saveResume();
      showExplanation(picked, ci, renderReverseQ);
    });
    return;
  }
  // ②フリー入力1問（形式判定のみ）
  h(
    '<div class="screen scene-wrap">'+
      topbar("逆質問", abortInterview)+
      '<div class="scene-img" style="flex:1.1">'+sceneImgHTML(sc.bg)+'</div>'+
      '<div class="scene-txt" style="flex:0 0 auto"><div class="nameplate">'+esc(persona.name)+'</div>'+
        '<div class="body">では、あなたから自由に質問をどうぞ。</div></div>'+
      '<div class="ta-wrap" style="flex:1">'+
        '<textarea class="answer" id="ans" placeholder="面接官に聞きたいことを入力"></textarea>'+
        '<div class="counter" id="cnt">0 字</div>'+
        '<button class="btn accent" id="send">質問する</button>'+
      '</div>'+
    '</div>'
  );
  bindBack(abortInterview);
  var ta=document.getElementById("ans"), cnt=document.getElementById("cnt");
  ta.oninput=function(){ cnt.textContent=ta.value.replace(/\s/g,"").length+" 字"; };
  document.getElementById("send").onclick=function(){
    var text=ta.value.trim(); if(!text){ toast("質問を入力してください"); return; }
    S.iv.qaAnswers.push({ category:"reverse", text:text, isProbe:false, keywords:{conclusion:[],example:GAME_DATA.qaBank[0].evalKeywords.example} });
    S.iv.transcript.push({ q:"[逆質問フリー]", a:text });
    S.iv._rqDone=false; saveResume(); advanceScene();
  };
}

/* ---------- 総合評価 ---------- */
function renderFullResult(){
  var sc=scoreFull(S.iv.qaAnswers, S.iv.mannerAnswers);
  var jobName=(JOBTYPES.find(function(j){return j.k===S.iv.sel.jobType;})||{}).n||S.iv.sel.jobType;

    stage:S.iv.sel.stage, persona:S.iv.persona.name, sel:S.iv.sel,   // A-2: 添削ログ用に面接条件を保持
    scores:{ manner:sc.manner, form:sc.form, consist:sc.consist, improvements:sc.improvements },
    transcript:S.iv.transcript
  };

  Store.del("resume");   // 完走したので中断データ削除

          '<div class="axis-box"><div class="n">'+sc.consist+'</div><div class="l">一貫性</div></div>'+
        '</div>'+

        sc.improvements.map(function(t,i){return '<div class="card" style="padding:12px 14px"><b style="color:var(--accent-d)">'+(i+1)+'.</b> '+esc(t)+'</div>';}).join("")+
        (hist.length>=2?'<h3 style="margin-top:16px">成長グラフ</h3>'+growthGraph(hist):'<div class="notice" style="margin-top:12px">成長グラフは2回目以降に表示されます</div>')+
        '<h3 style="margin-top:16px">AI添削に出す</h3>'+
        '<div class="copybox" id="cbox">'+esc(reviewLog.slice(0,300))+(reviewLog.length>300?' …':'')+'</div>'+
        '<button class="btn accent" id="copy">ログをコピー</button>'+
        '<div class="btn-row"><button class="btn" id="again">もう一度</button><button class="btn ghost" id="home">ホームへ</button></div>'+
      '</div>'+
    '</div>'
  );
  bindBack(screenFullHome);
  document.getElementById("copy").onclick=function(){ copyText(reviewLog,"面接ログをコピーしました"); };
  document.getElementById("again").onclick=screenSelect1;
  document.getElementById("home").onclick=screenFullHome;
}
/* 成長グラフ（3軸折れ線・SVG手描き） */
function growthGraph(hist){
  var data=hist.slice(0,10).reverse();   // 古→新
  var W=440,H=180,pad=28, n=data.length;
  function x(i){ return n<=1?W/2:pad+i*(W-2*pad)/(n-1); }
  function y(v){ return H-pad-(v/100)*(H-2*pad); }
  var axes=[{k:"manner",c:"#31507f"},{k:"form",c:"#c9a24b"},{k:"consist",c:"#2e7d5b"}];
  var lines=axes.map(function(a){
    var d=data.map(function(s,i){return (i===0?"M":"L")+x(i).toFixed(1)+" "+y(s.scores[a.k]).toFixed(1);}).join(" ");
    var dots=data.map(function(s,i){return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(s.scores[a.k]).toFixed(1)+'" r="3" fill="'+a.c+'"/>';}).join("");
    return '<path d="'+d+'" fill="none" stroke="'+a.c+'" stroke-width="2.5"/>'+dots;
  }).join("");
  var grid=[0,25,50,75,100].map(function(v){return '<line x1="'+pad+'" y1="'+y(v)+'" x2="'+(W-pad)+'" y2="'+y(v)+'" stroke="#eef1f6"/><text x="4" y="'+(y(v)+3)+'" font-size="9" fill="#9aa4b2">'+v+'</text>';}).join("");
  var legend='<g font-size="10">'+axes.map(function(a,i){return '<rect x="'+(pad+i*90)+'" y="4" width="10" height="10" fill="'+a.c+'"/><text x="'+(pad+14+i*90)+'" y="13" fill="#333">'+({manner:"マナー",form:"形式",consist:"一貫性"}[a.k])+'</text>';}).join("")+'</g>';
  return '<svg class="line-graph" viewBox="0 0 '+W+' '+H+'">'+grid+lines+legend+'</svg>';
}

/* ============================================================
   マナードリル（usage quiz/both を通し）
   ============================================================ */
function startDrill(){
  var list=GAME_DATA.mannerQuestions.filter(function(m){return m.usage==="quiz"||m.usage==="both";});
  S.drill={ list:list, idx:0, answers:[] };
  renderDrill();
}
function renderDrill(){
  var d=S.drill, q=d.list[d.idx], n=d.list.length;
  h('<div class="screen">'+topbar("ドリル "+(d.idx+1)+" / "+n, screenFullHome)+
    '<div class="progress"><i style="width:'+((d.idx+1)/n*100)+'%"></i></div>'+
    '<div class="scroll grow pad"><div class="q-stem"><div class="q-topic">'+esc(q.topic)+'</div><div>'+esc(q.prompt)+'</div></div><div id="choices"></div></div></div>');
  bindBack(screenFullHome);
  renderChoices(q, function(ci){
    var c=q.choices[ci];
    d.answers.push({ id:q.id, topic:q.topic, points:c.points, verdict:c.verdict });
    showExplanation(q, ci, function(){
      if(d.idx<d.list.length-1){ d.idx++; renderDrill(); } else renderDrillResult();
    });
  });
}
function renderDrillResult(){
  var r=scoreQuiz(S.drill.answers);
  h('<div class="screen scroll">'+topbar("ドリル結果", screenFullHome)+'<div class="pad">'+
    '<div class="score-hero"><div class="rank-badge">'+esc(r.rank.rank)+'</div><div class="score-num">'+r.score+'<span style="font-size:20px">点</span></div></div>'+
    '<h3>カテゴリ別</h3>'+r.topics.map(function(t){return '<div class="bar-row"><div class="bl"><span>'+esc(t.topic)+'</span><span>'+t.rate+'%</span></div><div class="bar"><i style="width:'+t.rate+'%"></i></div></div>';}).join("")+
    '<h3 style="margin-top:16px">弱点</h3><div>'+r.weak.map(function(w){return '<span class="weak-chip">'+esc(w.topic)+' '+w.rate+'%</span>';}).join("")+'</div>'+
    '<div class="btn-row"><button class="btn accent" id="again">もう一度</button><button class="btn ghost" id="home">ホームへ</button></div></div></div>');
  bindBack(screenFullHome);
  document.getElementById("again").onclick=startDrill;
  document.getElementById("home").onclick=screenFullHome;
}

function screenHistory(){
  var hist=loadHistory();
  h('<div class="screen scroll">'+topbar("履歴と成長", screenFullHome)+'<div class="pad" id="hl"></div></div>');
  bindBack(screenFullHome);
  var box=document.getElementById("hl");
  if(hist.length===0){ box.innerHTML='<div class="notice">まだ履歴がありません。面接を1周すると記録されます。</div>'; return; }
  var graph = hist.length>=2 ? '<h3>成長グラフ</h3>'+growthGraph(hist)+'<div class="divider"></div>' : '';
  box.innerHTML=graph+hist.map(function(s,i){
    var d=new Date(s.ts);
    return '<div class="list-item" data-i="'+i+'"><div style="font-weight:700">'+esc(s.jobName||s.jobType)+' / '+({first:"一次",final:"最終"}[s.stage]||s.stage)+'</div>'+
      '<div class="meta">'+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+'</div>'+

  }).join("");

    el.onclick=function(){ screenHistoryDetail(+el.getAttribute("data-i")); };
  });
}
function screenHistoryDetail(i){
  var s=loadHistory()[i]; if(!s){ screenHistory(); return; }

    '<h3>改善点</h3>'+s.scores.improvements.map(function(t,k){return '<div class="card" style="padding:10px 12px">'+(k+1)+'. '+esc(t)+'</div>';}).join("")+
    '<h3 style="margin-top:14px">回答ログ</h3>'+
    s.transcript.map(function(x){return '<div class="card" style="padding:12px"><div class="tiny muted">'+esc(x.q)+'</div><div>'+esc(x.a)+'</div></div>';}).join("")+
    '<button class="btn accent" id="copy" style="margin-top:12px">AI添削プロンプトをコピー</button>'+
    '</div></div>');
  bindBack(screenHistory);
  document.getElementById("copy").onclick=function(){ copyText(reviewLog,"プロンプトをコピーしました"); };
}

/* ============================================================
   PWA：Service Worker（best effort。file://等では静かに失敗）
   外部通信ゼロ・全埋め込みのため SW 無しでも全機能が劣化なく動作
   ============================================================ */
/* ============================================================
   A-2: 初回起動インストールガイド（非standalone・初回のみ）
   ============================================================ */
function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true;
}
function maybeShowInstallGuide(){
  if(isStandalone()) return;                          // standalone起動時は一切表示しない
  if(Store.get("installGuideDismissed",false)) return; // 「あとで」既押しなら以後表示しない
  var ua=navigator.userAgent||"";
  var isIOS=/iPhone|iPad|iPod/.test(ua), isAndroid=/Android/.test(ua);
  var hint;
  if(isIOS) hint="共有ボタン（□に↑のマーク）→「ホーム画面に追加」で、アプリとして使えます。";
  else if(isAndroid) hint="メニュー（⋮）→「アプリをインストール」または「ホーム画面に追加」で、アプリとして使えます。";
  else hint="ブラウザのメニューから「ホーム画面に追加」で、アプリとして使えます。";
  var m=document.createElement("div"); m.className="modal-bg install-bg";
  m.innerHTML='<div class="modal install-sheet">'+
      '<h3>アプリとして使うと便利です</h3>'+
      '<div class="ig-hint">'+esc(hint)+'</div>'+
      '<button class="btn ghost" id="ig-later">あとで</button>'+
    '</div>';
  document.body.appendChild(m);
  document.getElementById("ig-later").onclick=function(){ Store.set("installGuideDismissed",true); m.remove(); };
}

(function registerSW(){
  if(!("serviceWorker" in navigator)) return;
  try{
    var swCode="self.addEventListener('install',function(e){self.skipWaiting();});"+
               "self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});"+
               "self.addEventListener('fetch',function(e){/* 全内蔵のためネットワーク不要。素通し */});";
    var blob=new Blob([swCode],{type:"text/javascript"});
    var url=URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(function(){/* file://等は無視 */});
  }catch(e){/* 握りつぶし（機能に影響なし） */}
})();

/* ============================================================
   起動
   ============================================================ */
maybeShowInstallGuide();
startTrial();
